name: crawl-and-deploy

on:
  schedule:
    - cron: "17 1 * * *"   # 每天一次（UTC 01:17，即台北時間 09:17）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行測試
        run: python -m unittest discover -s tests -v

      - name: 抓取黑貓資料
        env:
          COA_API_URL: ${{ vars.COA_API_URL }}
        run: python scraper/fetch_coa.py

      # 部署到 Cloudflare Pages（需要在 repo 的 Secrets 設定 CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID）
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=black-cat-map --branch=main
