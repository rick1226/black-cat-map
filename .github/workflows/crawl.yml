name: crawl-and-deploy

on:
  schedule:
    - cron: "17 1 * * *"   # 每天一次（UTC 01:17，即台北時間 09:17）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行測試
        run: python -m unittest discover -s tests -v

      - name: 抓取黑貓資料
        env:
          COA_API_URL: ${{ vars.COA_API_URL }}
        run: python scraper/fetch_coa.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
